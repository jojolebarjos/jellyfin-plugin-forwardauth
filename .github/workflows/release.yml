name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish ForwardAuth/ForwardAuth.csproj --configuration Release --output publish

      - name: Zip plugin
        run: zip --junk-paths ForwardAuth.zip publish/ForwardAuth.dll

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ForwardAuth.zip --generate-notes

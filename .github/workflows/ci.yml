name: Build Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format ForwardAuth.slnx --verify-no-changes

      - name: Build
        run: dotnet build ForwardAuth.slnx --configuration Release
